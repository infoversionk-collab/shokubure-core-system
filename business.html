<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事業者専用ページ</title><link rel="stylesheet" href="./style.css"></head><body><header class="top"><a class="brand" href="./index.html">職ブレ <small>CORE System</small></a><nav><span id="role"></span><button id="logout" class="link">ログアウト</button></nav></header><main class="wrap"><h1 id="welcome">事業者専用ページ</h1><p id="notice"></p><section class="panel"><h2 id="jobtitle">求人管理</h2><form id="jobform"><label>求人タイトル<input name="job_title" required></label><label>雇用形態<input name="employment_type"></label><label>勤務地<input name="work_location"></label><label>給与下限<input name="salary_min" type="number"></label><label>給与上限<input name="salary_max" type="number"></label><label>仕事内容<textarea name="job_description" required></textarea></label><button class="btn">求人登録</button></form><div id="jobs"></div></section><section class="panel" id="talent"><h2>求職者検索</h2><p class="muted">非公開プロフィールは本人の許可がない限り開示しません。</p><div id="candidates"></div></section><section class="panel"><h2 id="applicationtitle">応募・紹介管理</h2><div id="applications"></div><div id="offers"></div></section><section class="panel"><h2>メッセージ</h2><div id="messages"></div></section><section class="panel"><h2>事業者情報</h2><form id="companyform"><label>会社名・屋号<input name="company_name"></label><label>法人番号<input name="corporate_number"></label><label>都道府県<input name="prefecture"></label><label>市区町村<input name="city"></label><label>Webサイト<input name="website_url"></label><button class="btn">保存</button></form></section></main><script type="module" src="./business.js"></script></body></html>
