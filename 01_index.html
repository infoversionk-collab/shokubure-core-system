<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="職ブレ-CORE System- 人材マッチングプラットフォーム">
  <title>職ブレ-CORE System-</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="authView" class="auth-shell">
    <section class="auth-card">
      <div class="brand">職ブレ <span>CORE System</span></div>
      <h1 id="authTitle">ログイン</h1>
      <p class="muted">企業と求職者をつなぐ採用プラットフォーム</p>
      <form id="authForm">
        <div id="nameWrap" class="field hidden"><label>氏名・担当者名</label><input id="displayName" autocomplete="name"></div>
        <div id="companyWrap" class="field hidden"><label>企業名（企業登録の場合）</label><input id="companyName"></div>
        <div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label>パスワード</label><input id="password" type="password" minlength="6" required autocomplete="current-password"></div>
        <div id="roleWrap" class="field hidden"><label>利用区分</label><select id="requestedRole"><option value="candidate">求職者</option><option value="company">企業</option><option value="employee">社内メンバー（承認制）</option><option value="partner">提携パートナー（承認制）</option></select></div>
        <button class="btn primary full" id="authSubmit">ログイン</button>
      </form>
      <div class="auth-links"><button class="link-button" id="toggleAuth">新規アカウント登録はこちら</button><button class="link-button" id="resetPassword">パスワードを忘れた場合</button></div>
      <p id="authMessage" class="message" role="status"></p>
    </section>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand side-brand">職ブレ <span>CORE</span></div>
      <div class="user-mini"><div class="avatar" id="avatar">C</div><div><strong id="userName">ユーザー</strong><small id="userRole">---</small></div></div>
      <nav id="sideNav"></nav>
      <button id="logoutButton" class="btn ghost full logout">ログアウト</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow">CORE PLATFORM</div><h1 id="viewTitle">ダッシュボード</h1></div>
        <div class="top-actions"><span id="todayLabel"></span><button class="icon-btn" id="refreshButton" title="更新">↻</button></div>
      </header>
      <div id="notice" class="notice hidden"></div>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
